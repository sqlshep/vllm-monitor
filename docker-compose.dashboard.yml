# Run THIS wherever you want to view the dashboard (laptop / another server).
#
#   cp .env.example .env    # set AGENT_URL + AGENT_TOKEN
#   docker compose -f docker-compose.dashboard.yml up -d --build
#   open http://localhost:8080

services:
  dashboard:
    build: ./dashboard
    container_name: vllm-monitor-dashboard
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - AGENT_URL=${AGENT_URL:?set AGENT_URL (http://PUBLIC_IP:9100)}
      - AGENT_TOKEN=${AGENT_TOKEN:?set AGENT_TOKEN}
